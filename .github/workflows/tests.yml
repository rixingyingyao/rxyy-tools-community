name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest tests rxyy_mcp/tests/test_codex_desktop.py rxyy_mcp/tests/test_codex_turns.py rxyy_mcp/tests/test_cursor_turns.py rxyy_mcp/tests/test_ext_bus.py rxyy_mcp/tests/test_runtime_adapter.py rxyy_mcp/tests/test_config_schema.py -q
      - run: python -m build --wheel
